# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly, 03:17 UTC -- drives the extended fuzz job.
    - cron: '17 3 * * *'

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'

    - name: Build
      run: go build -v ./...

    - name: Test (coverage, Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        PKGS=$(go list ./... | grep -vE '/benchmarks/|/benchmarks$|/main$')
        go test -short -covermode=atomic \
          -coverpkg="$(echo "$PKGS" | paste -sd,)" \
          -coverprofile=coverage.txt \
          $PKGS

    # shell: bash is required -- the Windows runner defaults to PowerShell,
    # which cannot parse the assignment or the pipeline below.
    - name: Test (race)
      shell: bash
      run: |
        PKGS=$(go list ./... | grep -vE '/benchmarks/|/benchmarks$|/main$')
        go test -short -race $PKGS

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  floor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.x'
    - name: Build
      run: go build -v ./...
    - name: Test
      run: |
        PKGS=$(go list ./... | grep -vE '/benchmarks/|/benchmarks$|/main$')
        go test -short $PKGS

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'
    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.12.2

    - name: Build and vet benchmarks
      working-directory: benchmarks
      run: |
        go build ./...
        go vet ./...

    - name: Lint benchmarks
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.12.2
        working-directory: benchmarks

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'
    - name: Build wasm
      run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm/

  differential:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install veraPDF
      run: ./scripts/install-verapdf.sh
    # Cross-checks gopdfrab's verdict against the veraPDF binary over both
    # committed conformance corpora (TestDifferentialVeraPDFCorpora)
    - name: Differential cross-check
      run: go test -run 'TestDifferentialVeraPDFCorpora|TestConvertNoResidualIssues' -v .

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'
    - name: Fuzz smoke
      run: ./scripts/fuzz.sh 20s
    - name: Upload crashers
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashers-smoke
        path: '**/testdata/fuzz/**'

  nightly-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'
    - name: Fuzz (extended)
      run: ./scripts/fuzz.sh 5m
    - name: Upload crashers
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashers
        path: '**/testdata/fuzz/**'
