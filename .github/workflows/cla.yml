# Asks first-time contributors to sign CLA.md, and records the signature.
#
# pull_request_target runs with write access to this repository, which the bot
# needs to store signatures and set the check. That is only safe because this
# job never checks out or executes the pull request's code -- do not add a
# checkout step here.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:

  cla:
    runs-on: ubuntu-latest
    steps:
    - name: Check the CLA signature
      # The sign sentence must match the action's own default byte for byte:
      # this comparison is case-sensitive, the action's is not. Do not set
      # custom-pr-sign-comment -- it switches the action from a forgiving
      # regex to exact equality, which only makes signing harder to get right.
      if: >
        (github.event.comment.body == 'recheck'
        || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
        || github.event_name == 'pull_request_target'
      uses: contributor-assistant/github-action@v2.6.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        path-to-signatures: signatures/cla.json
        path-to-document: https://github.com/voidrab/gopdfrab/blob/main/CLA.md
        branch: cla-signatures
        allowlist: SudoStar,dependabot[bot],renovate[bot]
        custom-notsigned-prcomment: >
          Thanks for the pull request. gopdfrab is dual-licensed under the AGPL
          3.0 and a commercial licence, so before this can be merged we need a
          one-time signature on the
          [Contributor Licence Agreement](https://github.com/voidrab/gopdfrab/blob/main/CLA.md).
          You keep your copyright; read it, it is short. To sign, post a new
          comment on this pull request with exactly the sentence below.
        custom-allsigned-prcomment: 'CLA signed, thank you. You will not be asked again.'
        # Merged pull requests stay open for follow-up discussion. The upstream
        # default locks them so a signature comment cannot be deleted after the
        # fact; the branch history is the record we rely on instead.
        lock-pullrequest-aftermerge: false
