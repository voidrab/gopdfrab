# Asks first-time contributors to sign CLA.md, and records the signature.
#
# pull_request_target runs with write access to this repository, which the bot
# needs to store signatures and set the check. That is only safe because this
# job never checks out or executes the pull request's code -- do not add a
# checkout step here.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:

  cla:
    runs-on: ubuntu-latest
    steps:
    - name: Check the CLA signature
      if: >
        (github.event.comment.body == 'recheck'
        || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
        || github.event_name == 'pull_request_target'
      uses: contributor-assistant/github-action@v2.6.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        path-to-signatures: signatures/cla.json
        path-to-document: https://github.com/voidrab/gopdfrab/blob/main/CLA.md
        branch: cla-signatures
        allowlist: SudoStar,dependabot[bot],renovate[bot]
        custom-notsigned-prcomment: >
          Thanks for the pull request. gopdfrab is dual-licensed under the AGPL
          3.0 and a commercial licence, so before this can be merged we need a
          one-time signature from $you on the
          [Contributor Licence Agreement](https://github.com/voidrab/gopdfrab/blob/main/CLA.md).
          You keep your copyright; read it, it is short. To sign, leave a new
          comment on this pull request containing the sentence below. Editing
          an existing comment will not work.
        custom-allsigned-prcomment: 'CLA signed, thank you. You will not be asked again.'
        lock-pullrequest-aftermerge: false
